<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexTerminal AI v10.4 - Pro Interactive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #07090e; color: #f3f4f6; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(13, 17, 23, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased pb-12">

    <!-- Header -->
    <header class="sticky top-0 z-50 glass border-b border-slate-800 px-4 lg:px-8 py-3.5 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white font-bold shadow-lg shadow-blue-500/20">
                <i class="fa-solid fa-bolt"></i>
            </div>
            <div>
                <h1 class="font-extrabold tracking-tight text-white text-sm lg:text-base">APEXTERMINAL <span class="text-blue-400">AI</span></h1>
                <p class="text-[10px] text-slate-400">Interactive Pro Edition v10.4</p>
            </div>
        </div>
        <button id="walletBtn" onclick="toggleWallet()" class="bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition shadow-lg shadow-blue-600/20 cursor-pointer">
            Connect Wallet
        </button>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Column 1 & 2: Radar & Audit -->
        <section class="lg:col-span-2 space-y-6">
            
            <!-- Chain Selector Toolbar -->
            <div class="glass p-4 rounded-2xl flex items-center justify-between gap-4">
                <div class="flex items-center gap-2 flex-1">
                    <label class="text-xs text-slate-400 font-semibold">Chain:</label>
                    <select id="chainSelect" onchange="changeChain(this.value)" class="bg-slate-900 border border-slate-700 text-white text-xs rounded-xl px-3 py-2.5 outline-none flex-1 max-w-xs cursor-pointer">
                        <option value="solana">Solana (SOL)</option>
                        <option value="ethereum">Ethereum (ETH)</option>
                        <option value="base">Base (BASE)</option>
                        <option value="bsc">BNB Chain (BSC)</option>
                        <option value="robinhood">Robinhood Chain (HOOD)</option>
                    </select>
                </div>
                <button onclick="loadRadar()" class="text-xs text-slate-300 bg-slate-900 hover:bg-slate-800 px-3.5 py-2.5 rounded-xl border border-slate-700 cursor-pointer transition">
                    <i class="fa-solid fa-rotate mr-1"></i> Refresh
                </button>
            </div>

            <!-- Market Radar Feed -->
            <div class="glass rounded-2xl p-5 border border-slate-800 flex flex-col">
                <div class="flex justify-between items-center mb-3">
                    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 flex items-center gap-2">
                        <i class="fa-solid fa-radar text-blue-400"></i> Market Radar (<span id="activeChainLabel" class="text-blue-400">SOLANA</span>)
                    </h2>
                    <span class="text-[10px] text-slate-400">Click any token below to trade/audit</span>
                </div>
                <div id="radarFeed" class="space-y-2.5 max-h-[340px] overflow-y-auto pr-1">
                    <!-- Populated instantly -->
                </div>
            </div>

            <!-- Security Audit Panel -->
            <div class="glass rounded-2xl p-5 border border-slate-800">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-shield-halved text-emerald-400"></i> AI Rug Shield Audit
                </h2>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="auditInput" placeholder="Select a token above or paste address..." class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-xs text-white font-mono outline-none focus:border-emerald-500">
                    <button onclick="runAudit()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl cursor-pointer transition shadow-lg shadow-emerald-600/20">Scan</button>
                </div>
                <div id="auditResult" class="p-3.5 bg-slate-900/90 rounded-xl text-xs text-slate-300 border border-slate-800 leading-relaxed">
                    <span class="text-slate-400"><i class="fa-solid fa-info-circle mr-1 text-blue-400"></i> Select any token from the radar above or paste an address to run a security audit.</span>
                </div>
            </div>

        </section>

        <!-- Column 3: Swap & Bot -->
        <section class="space-y-6">

            <!-- Swap Terminal -->
            <div class="glass rounded-2xl p-5 border border-slate-800">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-right-left text-blue-400"></i> Swap Terminal
                </h2>
                <div class="space-y-3.5 text-xs">
                    <div>
                        <label class="text-slate-400 block mb-1">Target Address</label>
                        <input type="text" id="swapTarget" placeholder="Select from radar..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white font-mono outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="text-slate-400 block mb-1">Amount (<span id="nativeSymbol">SOL</span>)</label>
                        <input type="number" id="swapAmount" value="0.1" step="0.01" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white font-mono outline-none focus:border-blue-500">
                    </div>
                    <button onclick="executeSwap()" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold py-3.5 rounded-xl transition cursor-pointer shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-bolt"></i> Execute Instant Swap
                    </button>
                </div>
            </div>

            <!-- Simulation Bot Control -->
            <div class="glass rounded-2xl p-5 border border-slate-800">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-300 mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-robot text-purple-400"></i> Simulation Bot
                </h2>
                <div class="space-y-3.5 text-xs">
                    <div class="flex justify-between items-center bg-slate-900 p-3.5 rounded-xl border border-slate-800">
                        <span class="text-slate-400">Paper Balance:</span>
                        <span id="botBalance" class="font-mono text-emerald-400 font-bold">$10,000.00</span>
                    </div>
                    <button id="botBtn" onclick="toggleBot()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition cursor-pointer shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-play"></i> Start Simulation Bot
                    </button>
                </div>
            </div>

        </section>

    </main>

    <!-- Application Script Logic -->
    <script>
        const mockTokens = {
            solana: [
                { name: 'Bonk', symbol: 'BONK', addr: 'DezXAZ8z7PnrnRJjz3wXBoRgixCa6xjnB7YaB1pPB263', price: '0.000024', change: '+14.2%', dex: 'Raydium' },
                { name: 'Dogwifhat', symbol: 'WIF', addr: 'EKpQGSJtjMFqKZ9KQanSqYXRcF8fBopzLHYxdM65zcjm', price: '2.14', change: '+8.5%', dex: 'Orca' },
                { name: 'Popcat', symbol: 'POPCAT', addr: '7GCihgDB8fe6KNjn2MYtkzZcRjQy3t9GHdC8uHYmW2hr', price: '0.78', change: '-3.1%', dex: 'Raydium' },
                { name: 'Cat in a dogs world', symbol: 'MEW', addr: 'MEW1gQWJ3nEXg2qgERiKu7FAFj79PHvQVREQUzScPP5', price: '0.0045', change: '+5.7%', dex: 'Raydium' }
            ],
            ethereum: [
                { name: 'Pepe', symbol: 'PEPE', addr: '0x6982508145454ce325ddbe47a25d4ec3d2311933', price: '0.000012', change: '+5.4%', dex: 'Uniswap' },
                { name: 'Turbo', symbol: 'TURBO', addr: '0xa35923162c49cf95eebbf262adb383b42ebc7025', price: '0.0074', change: '+12.1%', dex: 'Uniswap' },
                { name: 'Mog Coin', symbol: 'MOG', addr: '0xaaee154a8c2d34ec4fcc316ff1a9b2b524796328', price: '0.000001', change: '-1.8%', dex: 'Uniswap' }
            ],
            base: [
                { name: 'Brett', symbol: 'BRETT', addr: '0x532f27101965dd16442e59d40670faf5ebb142e4', price: '0.092', change: '+18.9%', dex: 'Uniswap' },
                { name: 'Moshi', symbol: 'MOSHI', addr: '0x42435df29759c47239074d287fa759b8ef421111', price: '0.0041', change: '-2.2%', dex: 'SwapBased' },
                { name: 'Degen', symbol: 'DEGEN', addr: '0x4ed4e862860bed51a9570b96d89af5e1b0efefed', price: '0.0112', change: '+9.4%', dex: 'Uniswap' }
            ],
            bsc: [
                { name: 'Floki', symbol: 'FLOKI', addr: '0xfb5b8394a1fcf13c233158f963a7638c4c79469e', price: '0.00018', change: '+4.3%', dex: 'PancakeSwap' },
                { name: 'BabyDoge', symbol: 'BABYDOGE', addr: '0xc748673057861a797270cd8a08873c75e0dffae6', price: '0.000000', change: '+1.1%', dex: 'PancakeSwap' }
            ],
            robinhood: [
                { name: 'Robinhood Dog', symbol: 'ROBIN', addr: '0xda256666c501cA0E01DEd461678853A10a120000', price: '0.0013', change: '+6.7%', dex: 'Robinhood L2' }
            ]
        };

        let currentChain = 'solana';
        let botRunning = false;
        let botTimer = null;
        let balance = 10000;
        let walletConnected = false;

        function loadRadar() {
            const feed = document.getElementById('radarFeed');
            if (!feed) return;
            feed.innerHTML = '';
            const tokens = mockTokens[currentChain] || mockTokens.solana;

            tokens.forEach(t => {
                const div = document.createElement('div');
                div.className = "bg-slate-900/90 hover:bg-slate-900 p-3 rounded-xl border border-slate-800 flex justify-between items-center cursor-pointer transition group";
                div.onclick = function() {
                    document.getElementById('swapTarget').value = t.addr;
                    document.getElementById('auditInput').value = t.addr;
                    runAudit();
                };
                div.innerHTML = `
                    <div>
                        <div class="font-bold text-white text-xs group-hover:text-blue-400 transition">$${t.symbol} <span class="text-[10px] text-slate-400 font-normal">(${t.name})</span></div>
                        <span class="font-mono text-[10px] text-slate-500">${t.dex}</span>
                    </div>
                    <div class="text-right">
                        <div class="font-mono text-xs font-bold text-white">$${t.price}</div>
                        <span class="text-[10px] font-semibold ${t.change.startsWith('+') ? 'text-emerald-400' : 'text-rose-400'}">${t.change}</span>
                    </div>
                `;
                feed.appendChild(div);
            });
        }

        function changeChain(val) {
            currentChain = val;
            document.getElementById('activeChainLabel').innerText = currentChain.toUpperCase();
            document.getElementById('nativeSymbol').innerText = currentChain === 'solana' ? 'SOL' : currentChain === 'bsc' ? 'BNB' : 'ETH';
            loadRadar();
        }

        function runAudit() {
            const inputElem = document.getElementById('auditInput');
            const resultElem = document.getElementById('auditResult');
            if(!inputElem || !resultElem) return;
            
            const val = inputElem.value.trim();
            if(!val) {
                alert("Please enter or select a token address first.");
                return;
            }
            resultElem.innerHTML = `
                <div class="text-emerald-400 font-bold mb-1"><i class="fa-solid fa-shield-check mr-1"></i> SAFE CONTRACT (Score: 96/100)</div>
                <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-300 mt-2">
                    <div>• Mint Authority: <span class="text-emerald-400">Renounced</span></div>
                    <div>• Liquidity Locked: <span class="text-emerald-400">98.5%</span></div>
                    <div>• Honeypot Risk: <span class="text-emerald-400">None</span></div>
                    <div>• Top Holder Concentration: <span class="text-emerald-400">Low</span></div>
                </div>
            `;
        }

        function executeSwap() {
            const target = document.getElementById('swapTarget').value.trim();
            const amt = document.getElementById('swapAmount').value;
            if(!target) {
                alert("Please select a target token from the Market Radar first.");
                return;
            }
            alert(`⚡ Successfully executed non-custodial swap of ${amt} on ${currentChain.toUpperCase()}!`);
        }

        function toggleBot() {
            botRunning = !botRunning;
            const btn = document.getElementById('botBtn');
            if(botRunning) {
                btn.innerHTML = `<i class="fa-solid fa-stop"></i> Stop Simulation Bot`;
                btn.className = "w-full bg-rose-600 hover:bg-rose-500 text-white font-bold py-3.5 rounded-xl transition cursor-pointer shadow-lg shadow-rose-600/20 flex items-center justify-center gap-2";
                botTimer = setInterval(() => {
                    balance += (Math.random() * 25 - 10);
                    document.getElementById('botBalance').innerText = `$${balance.toFixed(2)}`;
                }, 2000);
            } else {
                btn.innerHTML = `<i class="fa-solid fa-play"></i> Start Simulation Bot`;
                btn.className = "w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3.5 rounded-xl transition cursor-pointer shadow-lg shadow-rose-600/20 flex items-center justify-center gap-2";
                clearInterval(botTimer);
            }
        }

        function toggleWallet() {
            walletConnected = !walletConnected;
            const btn = document.getElementById('walletBtn');
            if(walletConnected) {
                btn.innerText = "0x7F2...89aB";
                btn.className = "bg-emerald-600 text-white font-bold text-xs px-4 py-2 rounded-xl transition cursor-pointer shadow-lg shadow-emerald-600/20";
            } else {
                btn.innerText = "Connect Wallet";
                btn.className = "bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs px-4 py-2 rounded-xl transition cursor-pointer shadow-lg shadow-blue-600/20";
            }
        }

        // Execute immediately upon parsing script
        loadRadar();
    </script>
</body>
</html>
